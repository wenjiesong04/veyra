name: Veyra smokes

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run gate smokes
        run: python3 scripts/run_smokes.py --group gate
      - name: Compile Python modules
        run: python3 -m compileall core interface runtime execution tool_proxy routers main.py scripts
