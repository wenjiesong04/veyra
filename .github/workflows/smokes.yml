name: Veyra smokes

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run invariant and cognitive capability gate
        run: python3 scripts/run_smokes.py --group gate
      - name: Run OpenClaw governance plugin tests
        working-directory: apps/openclaw/veyra-governance
        run: npm test
      - name: Compile Python modules
        run: python3 -m compileall awareness core execution guardian interface memory_bridge probes rollback_audit routers runtime skills tool_proxy main.py cli.py desktop_backend.py scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json
      - name: Install console dependencies
        working-directory: web
        run: npm ci
      - name: Build browser console
        working-directory: web
        run: npm run build
      - name: Check generated browser bundle freshness
        working-directory: web
        run: npm run check:bundle && npm run test:status-tone && npm run test:product-contract
      - name: Build desktop frontend
        working-directory: web
        run: npm run build:desktop
      - name: Ensure tracked console bundle is current
        run: git diff --exit-code -- ui/console
      - name: Validate Tauri config
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri -- info
